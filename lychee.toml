# Lychee configuration file
# Documentation: https://github.com/lycheeverse/lychee#configuration-file

# Maximum number of retries per link
max_retries = 3

# Maximum number of concurrent requests
max_concurrency = 10

# User agent string
user_agent = "Mozilla/5.0 (compatible; Lychee/0.15; +https://github.com/lycheeverse/lychee)"

# Accept these HTTP status codes as valid.
# 403 is accepted because many university, forum and publisher sites refuse
# automated clients with it, so it does not mean the link is dead.
# 429 (too many requests) is accepted for the same reason: it reports our
# request rate, not the link's state.
accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308, 403, 429]

# Timeout per request (in seconds)
timeout = 20

# Exclude local URLs and sites that block CI runners
exclude = [
  "http://localhost.*",
  "https://localhost.*",
  "http://127.0.0.1.*",
  "https://127.0.0.1.*",
  # quarto.org is a trusted site but may be unreachable from CI runners
  "https://quarto.org/.*",
  # support.bioconductor.org times out from CI runners, so every run fails
  # although no link is broken
  "https://support.bioconductor.org/.*",
  # oeis.org returned 503 on two consecutive runs on 2026-10-21 for the
  # LaTeX symbol guide linked from intro-to-R.qmd, so every PR fails
  # although no link in the PR changed
  "https://oeis.org/wiki/List_of_LaTeX_mathematical_symbols",
  # Links already dead (404 or an untrusted certificate) when this check was
  # added. Fix each in its own content PR, then delete its line here.
  "http://web1.sph.emory.edu/dkleinb/allDatasets.*",
  "https://drtomasaragon.github.io/",
  "https://www.r4epi.com/.*",
  "https://online.stat.psu.edu/stat504/book/",
  "https://resources.rstudio.com/webinars/a-gentle-introduction-to-tidy-statistics-in-r",
  "https://www.routledge.com/Generalized-Linear-Mixed-Models-.*",
  "https://regression.ucsf.edu/sites/g/files.*",
  "https://danieldsjoberg.com/ggsurvfit/",
]
