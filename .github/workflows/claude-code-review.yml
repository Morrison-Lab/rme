# Thin caller of the canonical Morrison-Lab/gha reusable review workflow.
#
# Keep this file named claude-code-review.yml and keep the workflow_dispatch
# `pr_number` input: claude.yml re-dispatches a review with
# `gh workflow run claude-code-review.yml -f pr_number=<n>` after an @claude
# run pushes commits. This stub only wires the triggers, secrets, and inputs;
# all the review logic (reviewer stash/restore, tag-vs-agent mode gating,
# inline-comment allowlist, read-only tool guard, allowed_bots for
# bot-dispatched runs, the is_error guard) lives in the reusable workflow.
# See Morrison-Lab/gha examples/claude-code-review.yml for the upstream stub.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Lets claude.yml re-dispatch a fresh review after an @claude run pushes
  # commits (GITHUB_TOKEN pushes don't fire `synchronize`, and the reusable
  # workflow's bot-actor filter would skip them anyway), and lets the
  # @claude-review comment path fire a review on demand.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets the reviewer read CI status (github_ci MCP server)
      # gha's reusable review job requests `checks: read` as of v2
      # (Morrison-Lab/gha#830) so it can call
      # /repos/{owner}/{repo}/commits/{ref}/check-runs. A called workflow
      # cannot request a permission its caller withheld, so omitting this
      # fails the whole run at startup, before any job exists -- which
      # produces no check run and so looks identical to no review being
      # due (rme#1142).
      checks: read
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@v3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }} # for the private latex-macros submodule
    with:
      # Wire the workflow_dispatch input through so claude.yml can re-dispatch
      # a review on Claude's commits; empty (and ignored) for pull_request runs.
      pr-number: ${{ inputs.pr_number }}
      # rme includes the latex-macros submodule; check it out so the reviewer
      # can read macros the chapters reference instead of reporting them as
      # "not initialized" (see PR #806).
      checkout-submodules: true
      # Flag PR-diff LaTeX simplifiable via an existing latex-macros/macros.qmd
      # macro, and nontrivial expressions repeated 3+ times that are
      # candidates for a new one. Needs checkout-submodules: true (above) to
      # find real macro definitions — the reviewer has no network-fetch tools.
      check-latex-macros: true
      # Same CAS tooling copilot-setup-steps.yml and claude.yml install, so the
      # reviewer's Bash tool can symbolically check a derivation it's reviewing
      # instead of eyeballing the algebra.
      apt-packages: maxima
      pip-packages: sympy
      prompt-addendum: |
        This is a math-heavy statistics textbook. When a diff includes a
        mathematical derivation, proof, or claimed identity, use the
        installed computer-algebra tools (SymPy via `python3 -c "..."`,
        Maxima via `maxima --very-quiet`) to symbolically check the steps
        rather than eyeballing the algebra — re-derive or verify each step,
        confirm dimensional/unit consistency in matrix expressions, and flag
        any step that doesn't hold. Also check any computed value or figure
        the prose describes against the PR-preview site (linked in a sticky
        comment on this PR) or the `gh-pages` branch's `pr-preview/pr-<N>/`
        files, rather than trusting the prose's own description of it.
