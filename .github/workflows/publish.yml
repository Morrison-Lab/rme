on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

# Serialize deploys so two pushes cannot race on the gh-pages branch.
#
# Without this, every push to main started an independent full-book render and
# they all raced to write gh-pages, where JamesIves force-writes _site and last
# writer wins in an undefined order. Measured 2026-08-24 (rme#1109): four
# merges inside seven minutes produced four concurrent runs, all still on the
# Render step 38 minutes later. These runs take 48-60 minutes, so the window in
# which an older one can overtake a newer one -- and republish a stale site,
# with nothing red to show for it -- is very wide.
#
# cancel-in-progress is true rather than the false in gha's example stub. That
# stub is written to be conservative for any consumer; here the workflow's only
# job is to publish the current tip of main, so an intermediate commit's site
# has no audience and rendering it for an hour is pure cost. Cancelling is safe
# at the deploy step because the deploy is a single git push -- it either lands
# whole or not at all -- and a cancelled run is superseded by the newer one
# that cancelled it.
#
# A cancelled run reports result == 'cancelled', not 'failure', so the
# report-failure job below is unaffected.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # zizmor flags the persisted credential here (artipacked). Keeping it,
      # deliberately: artipacked's concern is a credential leaking into an
      # uploaded artifact, and this job uploads none -- the only cache it
      # writes is `_freeze`, which does not contain `.git/config`. The deploy
      # step below does need git write access, and a 50-minute publish run is
      # the wrong place to discover that dropping it broke the deploy.
      - name: Check out repository  # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: list files
        shell: bash
        run: |
          ls

      - name: Set up Quarto
        # Pinned to the release tag rather than @HEAD: a branch pin moves under
        # us with no review and no dependabot PR, and dependabot's
        # github-actions updater deliberately skips unversioned pins, so @HEAD
        # was outside every safety net we have. claude.yml already used @v2.
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jags libcurl4-openssl-dev libpng-dev libfontconfig1-dev libjpeg-dev libglpk-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev libwebp-dev libnode109

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - uses: r-lib/actions/setup-renv@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          bypass-cache: never

      - name: Install local package
        run: |
          R CMD INSTALL .
        shell: bash

      - name: Render
        env:
          # Quarto's launcher caps Deno at an 8 GB V8 heap by default and
          # appends this env var's flags after its own, so the later
          # duplicate wins (V8 parses flags last-wins). Without a raised cap
          # the site render crashes with "Fatal JavaScript out of memory"
          # (exit 133); 12 GB of the runner's 16 GB leaves headroom for R,
          # LaTeX, and the OS (rme#1044, same mechanism as gha#263).
          QUARTO_DENO_V8_OPTIONS: --max-old-space-size=12288,--max-heap-size=12288
        shell: bash
        # One `quarto render` of the website profile builds every page in
        # all four of its formats (html, revealjs, pdf, docx) inside a
        # single Deno process, and the heap accumulates across those ~150
        # document renders — it blew through 12 GB after exceeding the old
        # 8 GB cap (rme#1044). Render each format as its own invocation
        # instead, resetting the Deno heap between formats — the same
        # per-format split gha's `preview` composite uses, which is why the
        # PR preview builds fit comfortably under the same cap.
        # `--no-clean` keeps earlier formats' output in _site.
        #
        # The PDF format is itself too big for one process: rme#1241 shows
        # `quarto render --to pdf` dying with "Fatal JavaScript out of
        # memory" at a 12.1 GB heap about 9.5 minutes in. Render the PDFs
        # one page per invocation so the heap resets for every page. The
        # page list is read from the website profile's `render:` list, so
        # new pages are picked up automatically.
        run: |
          set -euo pipefail
          mapfile -t pages < <(
            awk '/^  render:/ {in_render=1; next}
                 in_render && /^    - / {sub(/^    - /, ""); print; next}
                 in_render && !/^    #/ {in_render=0}' _quarto-website.yml
          )
          echo "Rendering ${#pages[@]} pages to PDF, one per invocation"
          test "${#pages[@]}" -gt 0
          for page in "${pages[@]}"; do
            quarto render "$page" --to pdf --no-clean
          done
          quarto render --to docx --no-clean
          quarto render --to revealjs --no-clean
          quarto render --to html --no-clean

      # We intentionally do NOT restore the cache before rendering on main, to
      # guarantee that the published website is always fresh and never uses
      # out-of-date frozen content. The Save step below exists solely to populate
      # the cache so that PR preview renders get a warm start.
      - name: Save Quarto freeze
        if: github.ref_name == 'main'
        uses: actions/cache/save@v6
        with:
          path: _freeze
          key: quarto-freezer-${{ runner.os }}-${{ hashFiles('renv.lock') }}-main-${{ github.sha }}

      - name: Deploy to gh-pages (preserving PR previews)
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: _site
          clean-exclude: pr-preview/

  # `publish.yml` runs only on push to `main`, so a failed deploy shows up
  # nowhere except the Actions tab -- no PR carries its result, and the
  # published site quietly goes stale. This job files an issue (or comments on
  # the one already open under the same title) when that happens.
  report-failure:
    needs: build-deploy
    # `always()` is what lets this job run at all once `build-deploy` failed;
    # the result check is what decides.
    if: >-
      always()
      && needs.build-deploy.result == 'failure'
      && github.event_name != 'pull_request'
    permissions:
      issues: write
    uses: Morrison-Lab/gha/.github/workflows/report-failure.yml@v2
    with:
      # Stable across runs -- this is the deduplication key.
      title: Publish workflow is failing
      body: >-
        The book did not deploy to `gh-pages`, so the published site may be
        stale. The run URL, commit, and triggering ref are appended
        below by the reusable workflow.
