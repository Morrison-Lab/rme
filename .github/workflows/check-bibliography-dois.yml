name: Check Bibliography DOIs

# Thin caller for the shared reusable workflow in Morrison-Lab/gha.
# The reusable workflow (and its bundled composite) scan every *.bib in the
# repo and validate that each DOI resolves and matches its CrossRef metadata.
# See https://github.com/Morrison-Lab/gha for inputs and versioning.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # The job id (check-dois) matches the sibling lab repositories, so the
  # status-check context name is the same everywhere. The token is
  # least-privilege; the reusable workflow only needs contents:read.
  check-dois:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-bibliography-dois.yml@v2
    with:
      # Entries that already failed when this check was added: books and older
      # articles with no DOI, plus debruyn2011mira (404). Add or correct an
      # entry's DOI and delete its key here, so the list only shrinks.
      exclude-keys: >-
        Adler2009random AllenCady1982 CaseBerg01 DigglePeter2013AoLD Edelmann2019 Faraway2025-io
        Greenland1989Modeling Grodstein2001 HobbsN.Thompson2015Bmas HulleyStephen1998RToE
        NahhasIRMPHR NahhasIntroR Orwoll1996 Stirzaker2005probability Vittinghoff2003
        agresti2010ordinal agresti2012categorical agresti2015foundations agresti2018introcat
        akaike1974new anderson1935irises andrews2012data appliedepiusingR aragon2018population
        aune2016bmi banerjee2014linear bates2015lme4 billingsley1995probability bolker.ecol.R
        box_draper_1987 boyd2004convex breusch1979simple calclifesaver canchola2003cox
        changRgraphicscookbook chatterjee2015regression cheng2025math clayton2013statistical
        congdon2020 copelan1991treatment cox1972regression dalgaardintroductory
