name: Check Links

# Thin caller for the shared reusable workflow in Morrison-Lab/gha.
# The reusable workflow runs a lychee link check over .qmd/.md/.html, honours
# a PR skip-label ("links checked by hand"), and auto-files an issue when
# links break on main. We pass our repo-local lychee.toml so the repo-specific
# excludes (e.g. quarto.org) apply.
# See https://github.com/Morrison-Lab/gha for inputs and versioning.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Run weekly on Mondays at 9:00 UTC to catch link rot
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # The job id (link-checker) matches the sibling lab repositories, so the
  # status-check context name is the same everywhere.
  link-checker:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: Morrison-Lab/gha/.github/workflows/check-links.yml@v2
    with:
      lychee-config: lychee.toml
