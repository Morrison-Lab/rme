# Diff-scoped, warn-only heuristic: flags a div (or a file with no div) whose first
# sentence starts with an unlinked The, These, Those, This or That, so nothing
# earlier in the div can be the antecedent.
name: Check definite antecedents

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-definite-antecedents.yml@v3
