# The group's own sites, names and works, for the check-self-credits check
# (Morrison-Lab/gha, check-self-credits). The group is the maintainer and the
# lab's members. A line that formally credits one of these is flagged.
# Credits to people outside the group never match. Links for further reading
# are never flagged.
urls:
  - morrison-lab.github.io
  - ucd-serg.github.io/lab-manual
  - github.com/Morrison-Lab
  - github.com/UCD-SERG
names:
  - Morrison-Lab/lds
  - Morrison-Lab/sds
  - Morrison-Lab/pds
  - Morrison-Lab/mds
  - Morrison-Lab/rme
  - Morrison-Lab/psw
  - Morrison-Lab/qwt
  - UCD-SERG lab manual
authors:
  - Morrison, Ezra
# Bibliography keys that are the group's own whatever their fields say.
keys: []
# The group's published papers and software, cited as the original
# publication or as a tool used, are ordinary citations and stay.
allow-keys: []
